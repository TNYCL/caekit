[package]
name = "caekit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Multiphysics engineering simulation"

[workspace]
members = ["crates/caekit-mesh", "crates/caekit-numerics", "crates/caekit-types"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TNYCL/caekit"

[workspace.dependencies]
caekit-mesh = { path = "crates/caekit-mesh", version = "0.1.0" }
caekit-types = { path = "crates/caekit-types", version = "0.1.0" }
caekit-numerics = { path = "crates/caekit-numerics", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[dependencies]
caekit-mesh.workspace = true
caekit-types.workspace = true
caekit-numerics.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
