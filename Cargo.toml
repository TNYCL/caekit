[package]
name = "caekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multiphysics engineering simulation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TNYCL/caekit"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
