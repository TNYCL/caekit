version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes the new SHA and keeps
  # the version comment next to it. Rust dependencies are updated by hand: their versions
  # are part of the minimum Rust version policy and of the provenance record.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
