[build-system]
# 1.9.4: PEP 639 license metadata and PYO3_BUILD_EXTENSION_MODULE for abi3 wheels.
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "caekit"
description = "Multiphysics engineering simulation: solve versioned CAEKit models and read reproducible run reports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
# Copies of the root files, kept identical by `node scripts/release.mjs sync-licenses`.
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "CAEKit contributors" }]
keywords = ["cae", "simulation", "fem", "multiphysics", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/caekit/caekit"
Documentation = "https://github.com/caekit/caekit/blob/master/docs/python.md"
Changelog = "https://github.com/caekit/caekit/blob/master/CHANGELOG.md"
Issues = "https://github.com/caekit/caekit/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "caekit._caekit"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
