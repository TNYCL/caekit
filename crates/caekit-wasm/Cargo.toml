[package]
name = "caekit-wasm"
description = "WebAssembly bindings for CAEKit multiphysics engineering simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Published to npm as `caekit-wasm` (build.mjs), not to crates.io.
publish = false

[lib]
crate-type = ["cdylib"]
# The `caekit` library crate owns the documentation name.
doc = false

[dependencies]
caekit.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

# FFI crate: the binding macros need `unsafe`, so the workspace lints are restated without
# the ban on it.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
